name: Verify

on:
  push:
    branches:
      - australia-game-upgrade
      - "op111/**"
      - "cursor/**"
  pull_request:
    branches:
      - australia-game-upgrade
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify
